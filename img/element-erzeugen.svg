<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" font-family="system-ui, sans-serif" role="img">
  <title>Element erzeugen, Text setzen, einfügen</title>
  <defs>
    <marker id="pfeil" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>
  <g stroke="#666" stroke-width="2">
    <line x1="190" y1="170" x2="210" y2="170" marker-end="url(#pfeil)"/>
    <line x1="390" y1="170" x2="410" y2="170" marker-end="url(#pfeil)"/>
  </g>
  <g fill="#fff7ef" stroke="#e8731c" stroke-width="2">
    <rect x="15" y="120" width="170" height="100" rx="10"/>
    <rect x="215" y="120" width="170" height="100" rx="10"/>
    <rect x="415" y="120" width="170" height="100" rx="10"/>
  </g>
  <g font-size="15" fill="#222" text-anchor="middle">
    <text x="100" y="152" font-weight="bold">1. Erzeugen</text>
    <text x="100" y="180" font-family="monospace" font-size="13">createElement('p')</text>
    <text x="300" y="152" font-weight="bold">2. Text setzen</text>
    <text x="300" y="180" font-family="monospace" font-size="13">textContent = 'Hallo'</text>
    <text x="500" y="152" font-weight="bold">3. Einfügen</text>
    <text x="500" y="180" font-family="monospace" font-size="13">parent.append(p)</text>
  </g>
  <text x="300" y="280" font-size="16" text-anchor="middle" fill="#666">Ergebnis: Ein neuer p-Absatz mit „Hallo“ ist im Dokument sichtbar.</text>
</svg>
