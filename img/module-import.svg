<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" font-family="system-ui, sans-serif" role="img">
  <title>ES-Module: script.js importiert aus zwei Dateien</title>
  <defs>
    <marker id="pfeil" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>
  <g stroke="#666" stroke-width="2" fill="none">
    <path d="M280 80 L150 200" marker-end="url(#pfeil)"/>
    <path d="M320 80 L450 200" marker-end="url(#pfeil)"/>
  </g>
  <g font-size="15" fill="#666">
    <text x="190" y="150" text-anchor="end">loadCards</text>
    <text x="410" y="150" text-anchor="start">renderCard</text>
  </g>
  <g fill="#fff7ef" stroke="#e8731c" stroke-width="2">
    <rect x="200" y="30" width="200" height="50" rx="10"/>
    <rect x="40" y="200" width="200" height="50" rx="10"/>
    <rect x="360" y="200" width="200" height="50" rx="10"/>
  </g>
  <g font-size="16" fill="#222" text-anchor="middle" font-family="monospace">
    <text x="300" y="60">script.js</text>
    <text x="140" y="230">data.js</text>
    <text x="460" y="230">render.js</text>
  </g>
  <text x="300" y="300" font-size="15" fill="#666" text-anchor="middle">Jedes Modul exportiert nur, was andere brauchen.</text>
</svg>
