<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" font-family="system-ui, sans-serif" role="img">
  <title>textContent gegen innerHTML</title>
  <g stroke="#ddd" stroke-width="2" fill="#fff">
    <rect x="30" y="30" width="260" height="280" rx="12"/>
    <rect x="310" y="30" width="260" height="280" rx="12"/>
  </g>
  <g font-size="18" font-weight="bold" fill="#222" text-anchor="middle">
    <text x="160" y="66">textContent</text>
    <text x="440" y="66">innerHTML</text>
  </g>
  <g font-size="15" fill="#666">
    <text x="50" y="104">Eingabe (Benutzertext):</text>
    <text x="330" y="104">Eingabe (Benutzertext):</text>
    <text x="50" y="128" font-family="monospace">&lt;b&gt;Hallo&lt;/b&gt;</text>
    <text x="330" y="128" font-family="monospace">&lt;b&gt;Hallo&lt;/b&gt;</text>
    <text x="50" y="176">Angezeigt als:</text>
    <text x="330" y="176">Angezeigt als:</text>
  </g>
  <g font-size="18" fill="#222">
    <text x="50" y="206">&lt;b&gt;Hallo&lt;/b&gt;</text>
    <text x="330" y="206" font-weight="bold">Hallo</text>
  </g>
  <g font-size="16" font-weight="bold" text-anchor="start">
    <text x="50" y="262" fill="#27ae60">Sicher: Text bleibt Text.</text>
    <text x="330" y="262" fill="#c0392b">Unsicher: Code wird ausgeführt.</text>
  </g>
</svg>
