<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lernkarten</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <h1>Lernkarten</h1>
    <p id="progress" class="progress"></p>

    <div class="scene">
      <div id="card" class="card" role="button" tabindex="0">
        <div class="face front">
          <p id="question" class="text"></p>
          <span class="hint">Tippen zum Umdrehen</span>
        </div>
        <div class="face back">
          <p id="answer" class="text"></p>
          <img id="answer-image" class="answer-image" alt="" hidden>
        </div>
      </div>
    </div>

    <div id="actions" class="actions" hidden>
      <button id="btn-wrong" type="button" class="wrong">Falsch</button>
      <button id="btn-right" type="button" class="right">Richtig</button>
    </div>

    <p id="status" class="status" hidden></p>
  </main>

  <script src="app.js"></script>
</body>
</html>
