<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lernkarten</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <h1>Lernkarten</h1>
    <p id="progress" class="progress"></p>

    <div id="stage" class="scene"></div>

    <div id="actions" class="actions" hidden>
      <button id="btn-wrong" type="button" class="wrong">Falsch</button>
      <button id="btn-right" type="button" class="right">Richtig</button>
    </div>

    <p id="status" class="status" hidden></p>
  </main>

  <script type="module" src="script.js"></script>
</body>
</html>
